name: CyberSalvageRush
options:
  bundleIdPrefix: com.aliaamir
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Set your Apple Developer Team ID here (Xcode > Settings > Accounts) for device builds.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SalvageCore:
    path: Packages/SalvageCore
targets:
  CyberSalvageRush:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SalvageCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Salvage Rush
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.aliaamir.CyberSalvageRush
            CFBundleURLSchemes:
              - cybersalvage
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliaamir.CyberSalvageRush
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  CyberSalvageRushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CyberSalvageRushTests
    dependencies:
      - target: CyberSalvageRush
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aliaamir.CyberSalvageRushTests
schemes:
  CyberSalvageRush:
    build:
      targets:
        CyberSalvageRush: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CyberSalvageRushTests
        - package: SalvageCore/SalvageCoreTests
